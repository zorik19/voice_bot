# База знаний: робот «Перезвоны КАСКО» (дожатие после отправки предложения)
# Формат: triggers — варианты реплик клиента (эмбеддятся для поиска),
# response — канонический ответ из скрипта (LLM пересказывает коротко).
# type: objection (возражение) | faq (вопрос-ответ) | routing (маршрутизация)

scenario: kasko_callback
items:
  # ---------- маршрутизация / особые ситуации ----------
  - id: wrong_number
    type: routing
    triggers:
      - "вы ошиблись номером"
      - "это не мой номер"
      - "такой человек здесь не живёт"
      - "не туда попали"
    response: >
      Спасибо за информацию. Чтобы мы вас более не беспокоили, обратитесь, пожалуйста,
      в офис Сбербанка для уточнения персональных данных по этому номеру телефона.
      Всего доброго. [Завершить звонок]

  - id: third_party
    type: routing
    triggers:
      - "это его жена"
      - "это её муж"
      - "он сейчас не может подойти"
      - "его нет дома"
      - "передам ему"
    response: >
      Уточнить, можно ли связаться с клиентом по этому номеру позднее, спросить удобное
      время, зафиксировать время повторного звонка и вежливо попрощаться.

  - id: already_called
    type: routing
    triggers:
      - "мне уже звонили"
      - "вы уже звонили по этому поводу"
      - "опять вы звоните"
    response: >
      С предложением по полису КАСКО со скидкой до тридцати процентов вы уже знакомы, верно?
      Если нет — коротко рассказать. Если да — спросить, какое решение принял клиент,
      напомнить, что срок действия предложения со скидкой подходит к завершению.

  - id: where_from_data
    type: faq
    triggers:
      - "откуда вы знаете мои данные"
      - "откуда у вас мой телефон"
      - "кто вам дал мой номер"
    response: >
      Вы являетесь клиентом Сбербанка, контактные данные были ранее предоставлены вами
      сотрудникам банка.

  - id: not_900
    type: objection
    triggers:
      - "почему звонок не с номера 900"
      - "сбербанк звонит с 900"
      - "вы мошенники"
      - "не верю что вы из сбера"
    response: >
      Хорошо, что вы так относитесь к своей финансовой безопасности. Сбербанк обзванивает
      клиентов с номера 900, а я звоню из СберСтрахования — это другое юридическое лицо
      группы Сбера. Звоним, так как вы ранее делали расчёт КАСКО. Персональные данные
      не требуются: всё предложение уже направлено на вашу электронную почту, если письма
      нет — проверьте папку спам. Направлю СМС с контактами менеджера.

  - id: want_operator
    type: routing
    triggers:
      - "соедините меня с оператором"
      - "хочу поговорить с живым человеком"
      - "переключите на менеджера"
    response: >
      Менеджеры отдела страхования КАСКО звонят по заявкам. Можно написать им в чат,
      указать телефон — и они свяжутся. Направлю СМС с контактами менеджеров.

  # ---------- возражения (РСВ) ----------
  - id: only_office
    type: objection
    triggers:
      - "доверяю только офису банка"
      - "не хочу заходить в приложение"
      - "не пользуюсь сбербанк онлайн"
      - "приду в отделение"
    response: >
      Оформить КАСКО со скидкой можно и в любом удобном офисе Сбера. Сотрудники отделения
      больше ориентированы на банковские продукты, поэтому при вопросах по оплате можно
      написать страховому консультанту в чат или на почту прямо из отделения.
      Направлю СМС с контактами менеджера.

  - id: not_on_call
    type: objection
    triggers:
      - "не хочу оформлять по телефону"
      - "не оформляю ничего на звонке"
      - "по телефону ничего покупать не буду"
    response: >
      На звонке оформлять ничего не нужно — ссылка уже направлена ранее. Оплатить полис
      можно картой Сбербанка или любой другой картой, как обычную онлайн-покупку.
      При вопросах по оплате поможет консультант в чате или по почте — направлю СМС
      с контактами.

  - id: no_need
    type: objection
    triggers:
      - "мне не нужно каско"
      - "в прошлом году не пригодилось"
      - "не хочу продлевать полис"
      - "нет необходимости"
    response: >
      КАСКО покрывает расходы независимо от того, кто виноват в ДТП. На дорогах много
      неаккуратных водителей, цены на запчасти выросли, а выплаты по ОСАГО ограничены —
      их часто не хватает на ремонт, и водители тратят накопления или берут кредиты.
      Предложить рассмотреть предложение, подчеркнуть, что решение за клиентом; можно
      рассмотреть разные программы. Направить СМС с контактами менеджера.

  - id: will_think
    type: objection
    triggers:
      - "я подумаю"
      - "у меня уже есть предложение от другой компании"
      - "у агента дешевле"
      - "не хочу новую компанию"
    response: >
      Всегда хочется выбрать самое выгодное предложение. СберСтрахование помогает сравнить
      условия разных программ и выбрать лучшее — консультация бесплатна, выбор всегда
      за клиентом. Можно направить нам предложение конкурентов — подготовим индивидуальное
      предложение с гибкими условиями. Направлю СМС с контактами менеджеров.

  - id: consult_family
    type: objection
    triggers:
      - "посоветуюсь с женой"
      - "спрошу у мужа"
      - "этим занимается супруг"
      - "надо обсудить с семьёй"
    response: >
      Конечно! Прямо сейчас ничего не оформляем — только напоминаю, что срок действия
      выгодного предложения скоро истекает. Консультант бесплатно поможет сравнить условия,
      выбор всегда за вами. Направлю СМС с контактами менеджеров, менеджер даст
      рекомендации, на что обратить внимание.

  - id: no_money
    type: objection
    triggers:
      - "нет денег"
      - "нечем платить"
      - "дорого"
      - "зарплату ещё не получил"
      - "на карте по нулям"
    response: >
      Понимаю, когда средства ограничены, особенно важно их сохранить. При этом ДТП,
      камень в стекло или угон предусмотреть невозможно, а затраты обычно большие.
      Мы можем изменить условия для снижения стоимости, рассмотреть рассрочку,
      дополнительную скидку или продлить срок действия предложения. Направлю СМС
      со ссылкой на чат и почту консультантов — они проверят, что можно сделать.

  - id: partial_kasko
    type: objection
    triggers:
      - "мне не нужно полное каско"
      - "каско только для кредита"
      - "хочу урезанное каско"
    response: >
      Направлю СМС с контактами консультантов — они подберут другие условия страхования
      без ограничений по кредитному договору. Есть вероятность, что такие предложения
      будут комфортнее по стоимости.

  - id: franchise_remove
    type: objection
    triggers:
      - "не хочу франшизу"
      - "как убрать франшизу"
      - "в полисе есть франшиза"
    response: >
      Индивидуальное предложение формируется на основе условий действующего полиса КАСКО
      и максимально их сохраняет. Консультанты подберут все возможные варианты —
      направлю СМС с контактами.

  - id: official_dealer
    type: objection
    triggers:
      - "хочу ремонт у официального дилера"
      - "гарантируете обслуживание у дилера"
    response: >
      Станции ремонта подбирает персональный менеджер по урегулированию убытка с учётом
      пожеланий клиента. Если автомобиль на гарантии — приоритет у официального дилера.
      Конкретная станция зависит от загруженности и наличия запчастей. Вопросы — менеджеру
      в чат или на почту, направлю СМС с контактами.

  # ---------- вопрос-ответ (FAQ) ----------
  - id: repeat_offer
    type: faq
    triggers:
      - "не понял, повторите"
      - "о каком предложении речь"
      - "в чём суть предложения"
      - "не понимаю о чём вы"
    response: >
      Для вас есть предложение по КАСКО со скидкой от СберСтрахования: полное КАСКО
      с заменой стёкол, зеркал и одного кузовного элемента без справок, без осмотра
      автомобиля, со скидкой от стоимости текущего полиса. Подробнее расскажет менеджер —
      направлю СМС с контактами.

  - id: discount_amount
    type: faq
    triggers:
      - "какая будет скидка"
      - "сколько это в деньгах"
      - "назовите точную сумму"
      - "какая стоимость полиса"
    response: >
      Предложение с уже учтённой скидкой направлено на вашу электронную почту.
      Если письмо не пришло — проверьте папку спам или свяжитесь с менеджером
      по страхованию. Направлю СМС с контактами. Точную сумму по телефону не называем.

  - id: sto_list
    type: faq
    triggers:
      - "где посмотреть список сто"
      - "какие станции в перечне"
      - "список сервисов назовите"
    response: >
      Список и подбор станций осуществляет персональный менеджер по урегулированию
      при наступлении страхового события, с учётом пожеланий. На гарантии — приоритет
      официального дилера. Направлю СМС с контактами менеджера.

  - id: link_broken
    type: faq
    triggers:
      - "ссылка не работает"
      - "не могу перейти по ссылке"
      - "ссылка не открывается"
    response: >
      Попробуйте Яндекс Браузер или установите сертификаты Минцифры с Госуслуг.
      Если не получится — напишите менеджеру в чат, он оперативно поможет.
      Направлю СМС с контактами.

  - id: advantages
    type: faq
    triggers:
      - "чем ваш полис лучше других"
      - "почему я должен выбрать вас"
      - "в чём преимущества сберстрахования"
      - "условия везде одинаковые"
    response: >
      Оформление без осмотра авто и скидка от действующего полиса. СберСтрахование —
      надёжная компания группы Сбера. Полис включает возмещение при ДТП, угоне,
      стихийных бедствиях, полной гибели; замена стекла, зеркал и одного кузовного
      элемента — без справок. Подробнее о вашем договоре — у менеджера, направлю СМС.

  - id: what_full_kasko
    type: faq
    triggers:
      - "что входит в полное каско"
      - "что значит полное каско"
    response: >
      Полное КАСКО покрывает ДТП, угон, стихийные бедствия (град, просадка грунта).
      Замена стёкол, зеркал и одного кузовного элемента — без справок. В полис входят
      эвакуатор и аварийный комиссар. Оформление удалённое, без осмотра автомобиля.

  - id: what_kasko
    type: faq
    triggers:
      - "что такое каско"
    response: >
      КАСКО — страхование автомобиля от угона и повреждений: ДТП, повреждения на парковке,
      падение деревьев, действия третьих лиц, стихийные бедствия. Главное достоинство —
      комплексная защита от самых разных бед.

  - id: what_franchise
    type: faq
    triggers:
      - "что такое франшиза"
    response: >
      Франшиза — сумма, которую при страховом случае клиент платит сам. Например, при
      франшизе пятнадцать тысяч и ремонте на сто тысяч клиент платит пятнадцать,
      страховая — восемьдесят пять. Франшиза заметно снижает стоимость полиса
      и включена примерно в сорок процентов полисов на рынке.

  - id: kasko_vs_osago
    type: faq
    triggers:
      - "чем отличается осаго от каско"
      - "зачем каско если есть осаго"
    response: >
      ОСАГО — обязательное страхование ответственности перед другими участниками движения.
      КАСКО защищает сам автомобиль клиента: на дороге и на стоянке. По ОСАГО у виновника
      может не оказаться полиса, применяется износ, лимит выплат ограничен; по КАСКО
      страховщик организует ремонт и покрывает ущерб полностью.

  - id: car_age_limit
    type: faq
    triggers:
      - "есть ли ограничения по возрасту автомобиля"
      - "мой автомобиль старый, подойдёт"
    response: >
      Ограничения есть, но на ваш автомобиль они не распространяются — предложение
      уже направлено. Если письмо не пришло — папка спам или менеджер. Направлю СМС.

  - id: insured_sum
    type: faq
    triggers:
      - "от чего зависит страховая сумма"
      - "хочу изменить страховую сумму"
    response: >
      Страховая сумма, как правило, равна стоимости автомобиля по справочнику рыночных
      стоимостей в регионе. Изменить её можно через менеджера — направлю СМС с контактами.

  - id: settlement_time
    type: faq
    triggers:
      - "каков срок урегулирования"
      - "как быстро выплатите"
    response: >
      По Правилам решение о признании случая страховым, выплата или направление на ремонт —
      в течение тридцати календарных дней после полного комплекта документов.
      На практике быстрее.

  - id: payout_amount
    type: faq
    triggers:
      - "как определяется сумма выплаты"
    response: >
      Исходя из страховой суммы договора с учётом франшиз, индексации и варианта
      урегулирования. Если это не полная гибель или угон — оплачивается стоимость ремонта.

  - id: e_policy
    type: faq
    triggers:
      - "полис будет электронный или бумажный"
      - "что такое электронное каско"
    response: >
      Электронный полис — тот же продукт КАСКО, оформленный в электронном виде.
      Отличие от бумажного только в способе оформления.

  - id: installments
    type: faq
    triggers:
      - "можно ли в рассрочку"
      - "есть рассрочка"
    response: >
      Да, полис КАСКО можно купить в рассрочку. Чтобы включить рассрочку, напишите
      менеджеру в чат или на почту — направлю СМС с контактами.

  - id: add_driver
    type: faq
    triggers:
      - "можно вписать водителя после оформления"
      - "добавить водителя в полис"
    response: >
      Список водителей можно изменить после заключения договора по соглашению сторон;
      может потребоваться пересчёт стоимости с учётом возраста и стажа.

  - id: what_if_accident
    type: faq
    triggers:
      - "что делать при страховом случае"
      - "куда звонить при дтп"
    response: >
      Позвоните в контакт-центр: девятьсот с мобильного, для звонков из любой точки мира —
      плюс семь четыреста девяносто пять пятьсот пятьдесят пять пятьдесят. Круглосуточно
      и бесплатно по России. Специалист расскажет порядок действий.

  - id: exclusions
    type: faq
    triggers:
      - "какие исключения из покрытия"
      - "когда не заплатите"
    response: >
      Выплаты не производятся, если за рулём был человек, не указанный в договоре,
      или ущерб возник из-за эксплуатации неисправного автомобиля. Остальные исключения
      описаны в договоре и Правилах страхования.

  - id: documents_after
    type: faq
    triggers:
      - "какие документы я получу"
    response: >
      Полис, правила страхования, ключевой информационный документ и памятка.

  - id: territory
    type: faq
    triggers:
      - "где действует полис"
      - "территория страхования"
    response: >
      На территории Российской Федерации, за исключением территорий вооружённых
      конфликтов, войн и чрезвычайных положений.

  - id: which_car
    type: faq
    triggers:
      - "на какой автомобиль распространяется предложение"
    response: >
      На автомобиль, по которому в ближайшее время заканчивается полис КАСКО.

  - id: why_calling
    type: faq
    triggers:
      - "почему вы мне звоните"
      - "с какой целью звоните"
    response: >
      Мы звоним клиентам, которым ранее направляли предложение по страхованию КАСКО.

  - id: several_glasses
    type: faq
    triggers:
      - "если разбито несколько стёкол сразу"
      - "повреждено несколько элементов"
    response: >
      При повреждении нескольких элементов за один случай клиент выбирает один любой
      элемент для возмещения без документов; остальные восстанавливаются за свой счёт.

  - id: recent_accident
    type: faq
    triggers:
      - "автомобиль недавно был в аварии"
      - "машина недавно повреждена"
    response: >
      Если недавно был страховой случай, направленное предложение может быть неактуальным —
      уточните у менеджера по страхованию. Направлю СМС с контактами.

  - id: osago_offer
    type: faq
    triggers:
      - "могу ли я оформить у вас осаго"
    response: >
      Предложение по ОСАГО можно посмотреть на сайте Сбербанка или в приложении
      СберБанк Онлайн.

  - id: two_policies
    type: faq
    triggers:
      - "можно ли два полиса каско"
    response: >
      Договор страхования в отношении одного транспортного средства должен быть один.
