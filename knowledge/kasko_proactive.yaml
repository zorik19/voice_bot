# База знаний: проактивный обзвон "клиент посчитал КАСКО и не оплатил".
# Формат: triggers — варианты реплик клиента (эмбеддятся для поиска),
# response — канонический ответ (LLM пересказывает своими словами, факты точно).
# type: objection (возражение) | faq (вопрос-ответ) | routing (маршрутизация)
#
# ЧЕРНОВИК: формулировки нужно сверить с Бобылевой Мариной Анатольевной
# (реальные фразы, которые заходят на живых звонках) и договориться
# о регулярности мини-демо для сверки — см. постановку, раздел 5.

scenario: kasko_proactive
items:
  # ---------- легитимность звонка ----------
  - id: where_from_data
    type: faq
    triggers:
      - "откуда у вас мои данные"
      - "откуда у вас мой номер"
      - "кто вам дал мой телефон"
    response: >
      Вы сами считали КАСКО на сайте СберСтрахования и указывали свои данные
      для расчёта — звоню именно по нему.

  - id: not_900
    type: objection
    triggers:
      - "почему звоните не с номера 900"
      - "сбербанк звонит с 900"
      - "не верю что вы из сбера"
      - "вы мошенники"
    response: >
      Сбербанк действительно звонит с девятисот, а я из СберСтрахования —
      отдельной компании группы Сбера. Звоню по вашему расчёту КАСКО.

  - id: verify_identity
    type: faq
    triggers:
      - "как убедиться что это сберстрахование"
      - "докажите что вы не мошенники"
    response: >
      Сейчас пришлю смс с номера СберСтрахования — так вы сможете убедиться,
      что это мы.

  - id: want_operator
    type: routing
    triggers:
      - "соедините меня с оператором"
      - "хочу поговорить с живым человеком"
      - "переключите на менеджера"
    response: >
      Передала ваш звонок оператору, он свяжется с вами в течение дня.

  # ---------- продукт: основы ----------
  - id: what_kasko
    type: faq
    triggers:
      - "что такое каско"
    response: >
      Это страхование самого автомобиля: от ДТП, угона, пожара, стихии,
      вандализма — в отличие от ОСАГО, которое покрывает ущерб другим людям.

  - id: kasko_vs_osago
    type: faq
    triggers:
      - "чем каско отличается от осаго"
      - "зачем каско если есть осаго"
    response: >
      ОСАГО платит за ущерб, который вы причинили другим, и с ограничением
      по сумме. Если виноваты не вы — платит чужая страховая, а если у виновника
      её нет — придётся судиться. КАСКО чинит именно вашу машину независимо
      от того, кто виноват.

  - id: what_franchise
    type: faq
    triggers:
      - "что такое франшиза"
    response: >
      Часть ущерба, которую вы оплачиваете сами, а страховая — остальное,
      за счёт этого полис дешевле. Например, ремонт на сто тысяч, франшиза
      пятнадцать тысяч — вы платите пятнадцать, страховая — восемьдесят пять.

  - id: risks_included
    type: faq
    triggers:
      - "что входит в полис"
      - "какие риски покрыты"
      - "что считается страховым случаем"
    response: >
      Полное покрытие: ДТП, угон, полная гибель авто, пожар, стихия, падение
      предметов, действия третьих лиц. Стёкла, зеркала, фары и один элемент
      кузова — без справок.

  - id: glass_no_docs
    type: faq
    triggers:
      - "какие стёкла можно заменить без справок"
      - "что входит в ремонт без справок"
    response: >
      Лобовое, заднее, боковые стёкла, фары, противотуманки, зеркала
      и повторители поворотов — без ограничений числа обращений в год.
      По кузову — один элемент в год без справок.

  - id: inspection_needed
    type: faq
    triggers:
      - "нужен ли осмотр автомобиля"
      - "надо приезжать на осмотр"
    response: >
      Нет, по действующему полису КАСКО осмотр не нужен — оформляем по данным
      текущего полиса.

  - id: inspection_no_active_policy
    type: faq
    triggers:
      - "у меня нет действующего каско можно без осмотра"
      - "страховки сейчас нет нужен осмотр"
    response: >
      Тогда осмотр понадобится, но это несложно — через приложение «Россмотр»
      сами сфотографируете машину.

  - id: ready_for_inspection
    type: faq
    triggers:
      - "готов сделать осмотр что дальше"
      - "как пройти осмотр через россмотр"
    response: >
      Пришлю смс со ссылкой на приложение «Россмотр». Сделаете фото и короткое
      видео по инструкции — днём, машина чистая. После проверки сформируем полис.

  - id: e_policy
    type: faq
    triggers:
      - "полис бумажный или электронный"
    response: >
      Электронный, по сути тот же полис, просто без бумаги — пришлём на почту.

  - id: installments
    type: faq
    triggers:
      - "можно ли в рассрочку"
      - "есть ли рассрочка"
    response: >
      Да, можно разбить оплату на части: первый взнос сейчас, второй — через
      три месяца. Детали уточнит менеджер в чате.

  - id: add_driver
    type: faq
    triggers:
      - "можно ли добавить водителя"
      - "как вписать ещё одного водителя"
    response: >
      Да, можно вписать дополнительного водителя после оформления через личный
      кабинет. Если договор ещё не заключён — дайте данные прав, впишем сразу.

  - id: who_covered
    type: faq
    triggers:
      - "полис действует только на меня"
      - "на кого распространяется каско"
    response: >
      КАСКО защищает только тех водителей, чьи имена прямо указаны в полисе.

  - id: profi_program
    type: faq
    triggers:
      - "что такое программа профи"
      - "расскажите про профи"
    response: >
      Это полное КАСКО для опытных водителей: половину стоимости платите сейчас,
      вторую половину — только если наступит страховой случай. Могу посчитать
      по ней, если интересно.

  - id: total_loss_percent
    type: faq
    triggers:
      - "какой процент считается полной гибелью"
      - "с какого процента списывают авто"
    response: >
      От семидесяти процентов стоимости — это осознанный порог, он даёт клиенту
      отремонтированный автомобиль в большинстве случаев, а не списание.

  - id: off_road_coverage
    type: faq
    triggers:
      - "повреждение во дворе входит в покрытие"
      - "действует ли каско на парковке"
    response: >
      Да, дворы, стоянки, заправки и прилегающие территории входят в зону
      покрытия.

  - id: franchise_glass
    type: faq
    triggers:
      - "франшиза действует на лобовое стекло"
      - "при ремонте стекла есть франшиза"
    response: >
      Если виновник не установлен, франшиза применяется. Если виновник
      известен — ремонт полностью за наш счёт.

  - id: drone_risk
    type: faq
    triggers:
      - "покрывает ли полис падение дрона"
      - "страховой случай при бпла"
    response: >
      Да, входит как падение инородных предметов, в том числе беспилотников.

  - id: expand_liability
    type: faq
    triggers:
      - "можно расширить гражданскую ответственность"
      - "увеличить лимит по го"
    response: >
      Да, можно увеличить лимит — до шестисот тысяч, миллиона, полутора
      или трёх миллионов рублей, с доплатой.

  - id: gap_insurance
    type: faq
    triggers:
      - "что такое gap страхование"
      - "у вас есть gap"
    response: >
      Это доплата до первоначальной стоимости авто при угоне или полной
      гибели. У нас такой опции нет, но предложим другие варианты защиты.

  - id: theft_and_total_only
    type: faq
    triggers:
      - "можно застраховать только от угона и полной гибели"
    response: >
      Нет, только полное КАСКО — зато в него уже включены все основные риски.

  - id: territory
    type: faq
    triggers:
      - "действует ли полис за границей"
      - "где действует каско"
    response: >
      По России и в Беларуси, если подключено расширение территории —
      включим по желанию. В Европе полис не действует.

  - id: tech_inspection
    type: faq
    triggers:
      - "нужен ли техосмотр для каско"
      - "нужна диагностическая карта"
    response: >
      Нет, диагностическая карта для КАСКО не требуется.

  # ---------- расчёт и скидка клиента ----------
  - id: exact_discount
    type: faq
    triggers:
      - "какая точно будет скидка"
      - "сколько я сэкономлю"
    response: >
      Назови реальную цифру из расчёта клиента: цену и экономию в сумме
      или процентах — без общих фраз вроде "до тридцати процентов".

  - id: price_increased
    type: faq
    triggers:
      - "почему цена выросла в несколько раз"
      - "стоимость сильно подорожала"
    response: >
      Стоимость запчастей и ремонта заметно выросла, плюс могли повлиять
      прошлые убытки. Но мы подобрали максимальную скидку, которая для вас
      возможна.

  - id: discount_30_percent
    type: faq
    triggers:
      - "как получить скидку до тридцати процентов"
      - "где обещанные тридцать процентов"
    response: >
      Она идёт по программе «Переход» для клиентов с действующим полисом
      другой компании, если не было аварий. Расчёт клиента уже с учётом
      этой скидки.

  - id: sber_premier_discount
    type: faq
    triggers:
      - "применили скидку сбер премьер"
      - "учли скидку премьер"
    response: >
      Да, она автоматически учтена в расчёте, если клиент участник программы.

  - id: past_losses_affect
    type: faq
    triggers:
      - "влияют ли прошлые убытки на цену"
      - "почему так дорого если аварий не было"
    response: >
      Да, частота и размер убытков учитываются. Если ДТП были не по вине
      клиента — пусть пришлёт документы, сделаем индивидуальный пересчёт.

  - id: change_insurance_sum
    type: faq
    triggers:
      - "можно ли изменить страховую сумму"
      - "хочу другую страховую сумму"
    response: >
      Да, можем посчитать с другой суммой — это повлияет на цену. Спроси,
      какую сумму хочет видеть клиент, и подбери ближайший вариант из
      готовой таблицы альтернатив.

  - id: offer_validity
    type: faq
    triggers:
      - "какой срок действия предложения"
      - "до какого числа актуален расчёт"
    response: >
      Расчёт актуален четырнадцать дней с даты расчёта — успеет подумать,
      но лучше не затягивать.

  # ---------- возражения по цене/условиям (таблица альтернатив, шаг 5) ----------
  - id: too_expensive
    type: objection
    triggers:
      - "дорого"
      - "нет денег"
      - "не могу себе позволить"
    response: >
      Я как раз для этого и звоню — чтобы подобрать более выгодный вариант
      по машине клиента. Найди в готовой таблице альтернатив цену ближе к тому,
      что клиент готов заплатить, и назови её сразу, не более двух попыток
      за звонок.

  - id: franchise_remove
    type: objection
    triggers:
      - "не хочу франшизу"
      - "как убрать франшизу"
    response: >
      Если в прошлом полисе франшизы не было, можно сохранить те же условия —
      пусть пришлёт скан прошлого полиса, подготовим расчёт без франшизы.

  - id: official_dealer_repair
    type: objection
    triggers:
      - "хочу ремонт у официального дилера"
    response: >
      Можно сделать расчёт с ремонтом у дилера, будет доплата — посмотри,
      насколько изменится цена по таблице альтернатив.

  - id: mileage_limit_discount
    type: objection
    triggers:
      - "хочу ограничение пробега чтобы снизить цену"
    response: >
      Мы не ограничиваем пробег, но можем снизить стоимость за счёт других
      условий — франшизы или страховой суммы, посмотри альтернативы.

  - id: competitor_cheaper
    type: objection
    triggers:
      - "у другой страховой дешевле"
      - "у конкурентов выгоднее"
    response: >
      Пусть пришлёт их расчёт или скрин переписки — сравним условия
      и посмотрим, что можем предложить взамен.

  - id: consult_family
    type: objection
    triggers:
      - "посоветуюсь с женой"
      - "спрошу у мужа"
      - "надо обсудить с семьёй"
    response: >
      Конечно, торопить не буду. Предложи прислать скан текущего полиса
      прямо сейчас — пока клиент думает, у него уже будет точный расчёт
      со скидкой на руках, сравнивать будет проще.

  - id: no_need_kasko
    type: objection
    triggers:
      - "не нужно каско вообще"
      - "не хочу продлевать полис"
    response: >
      КАСКО покрывает расходы, даже если клиент не виноват в ДТП, а ОСАГО
      многие риски вообще не покрывает — стихию, повреждения на стоянке.
      Решение всё равно за клиентом.

  # ---------- процесс оформления и документы ----------
  - id: not_on_call
    type: objection
    triggers:
      - "не хочу оформлять на звонке"
      - "по телефону ничего покупать не буду"
    response: >
      На звонке ничего оформлять и не нужно — перейдёт в чат по ссылке,
      приложит полис, увидит точную цену. Решение за клиентом.

  - id: link_uncomfortable
    type: objection
    triggers:
      - "неудобно переходить по ссылке"
      - "нет времени на это"
    response: >
      Там не нужно ничего считать или вводить — просто прикрепить фото
      текущего полиса, дальше менеджер сам всё посчитает.

  - id: only_office
    type: objection
    triggers:
      - "доверяю только офису банка"
      - "приду в отделение"
    response: >
      Оплатить можно будет в отделении, но чтобы посчитать скидку, сначала
      нужно прислать фото полиса в чат.

  - id: policy_only_on_phone
    type: faq
    triggers:
      - "полис только в телефоне как его отправить"
      - "как переслать электронный полис"
    response: >
      Сохранит как pdf или сделает скриншот и пришлёт в чат; если не получится —
      менеджер поможет.

  - id: why_send_previous_policy
    type: faq
    triggers:
      - "зачем присылать текущий полис"
      - "зачем вам скан старого полиса"
    response: >
      Чтобы не запрашивать другие данные и не делать осмотр авто — это даёт
      дополнительную скидку и ускоряет оформление.

  - id: how_to_pay
    type: faq
    triggers:
      - "как оплатить полис"
      - "куда платить"
    response: >
      Пришлём образец полиса и ссылку на оплату на почту. Если не пришла —
      проверьте папку спам, либо сообщите, отправим повторно.

  # ---------- страховые случаи и урегулирование ----------
  - id: what_if_accident
    type: faq
    triggers:
      - "что делать при страховом случае"
      - "куда звонить при дтп"
    response: >
      Звонить на девятьсот или плюс семь четыреста девяносто пять пятьсот
      пятьдесят пять пятьдесят — круглосуточно и бесплатно по России.
      Или заявить через личный кабинет.

  - id: theft_payout_timing
    type: faq
    triggers:
      - "когда выплата при угоне"
      - "возмещение после угона когда"
    response: >
      После предоставления документов о возбуждении уголовного дела —
      завершения дела ждать не нужно.

  - id: personal_manager
    type: faq
    triggers:
      - "есть ли персональный менеджер по урегулированию"
    response: >
      Да, после регистрации убытка подключится персональный менеджер.

  - id: assistance_cities
    type: faq
    triggers:
      - "в каких городах доступен эвакуатор"
      - "где работает аварийный комиссар"
    response: >
      Список городов направлю отдельной ссылкой в смс.

  - id: cash_payout
    type: faq
    triggers:
      - "можно получить выплату деньгами вместо ремонта"
    response: >
      По нашему стандарту — ремонт. Денежная выплата возможна в отдельных
      случаях, обсуждается индивидуально с менеджером.

  - id: settlement_time
    type: faq
    triggers:
      - "какой срок урегулирования"
      - "как быстро выплатите"
    response: >
      Решение принимается до тридцати дней после подачи всех документов,
      обычно быстрее.

  # ---------- изменение условий и расторжение ----------
  - id: change_conditions_after
    type: faq
    triggers:
      - "можно ли изменить условия после оформления"
    response: >
      Да, например добавить водителя или изменить способ ремонта.
      По стоимости пересчитаем.

  - id: cancel_and_refund
    type: faq
    triggers:
      - "как расторгнуть полис и вернуть деньги"
    response: >
      Возвращается часть премии за неиспользованный срок, за вычетом
      расходов, по заявлению. Есть период охлаждения — четырнадцать дней
      при отсутствии обращений.

  - id: cooling_period
    type: faq
    triggers:
      - "что такое период охлаждения"
    response: >
      В течение четырнадцати дней после покупки можно отказаться от полиса
      и вернуть уплаченную сумму, если не было страховых случаев.

  # ---------- сравнение и общие вопросы ----------
  - id: osago_here
    type: faq
    triggers:
      - "можно ли у вас оформить осаго"
    response: >
      Да, в приложении Сбербанк Онлайн, в разделе «Страхование». Я по КАСКО,
      поэтому ОСАГО не рассчитываю.

  - id: transition_program
    type: faq
    triggers:
      - "что такое переход из другой компании"
    response: >
      Это программа, по которой клиент получает скидку за действующий полис
      другой страховой, если не было убытков.

  - id: car_not_registered
    type: faq
    triggers:
      - "машина ещё не поставлена на учёт можно застраховать"
    response: >
      Да, страховать можно и до постановки на учёт — сделаем расчёт под
      автомобиль клиента.

  - id: documents_after
    type: faq
    triggers:
      - "какие документы я получу после оформления"
    response: >
      Полис, правила страхования, ключевой информационный документ и памятка —
      всё в электронном виде.

  - id: model_name_mismatch
    type: faq
    triggers:
      - "модель авто написана с маленькой буквы это ошибка"
    response: >
      Нет, не ошибка — система подтягивает данные по вин-номеру,
      на выплаты это не влияет.

  - id: advantages
    type: faq
    triggers:
      - "в чём преимущества вашего каско"
      - "почему я должен выбрать вас"
    response: >
      Без осмотра по действующему полису, реальная скидка из расчёта клиента,
      стёкла без справок без ограничений, один кузовной элемент без справок,
      быстрое урегулирование.

  # ---------- отказ: маршрутизация на завершение без продажи (шаг 8) ----------
  - id: already_insured
    type: routing
    triggers:
      - "уже оформил"
      - "уже застраховался"
      - "есть страховка"
      - "страховал"
    response: >
      Клиент уже застрахован или оформил КАСКО в другом месте — предлагать
      условия дальше не нужно, это трата его времени. Скажи "поняла вас,
      спасибо за ответ, всего доброго" и сразу заканчивай разговор, ничего
      больше не презентуй и не уточняй.

  - id: no_car
    type: routing
    triggers:
      - "нет машины"
      - "продал автомобиль"
    response: >
      У клиента больше нет этого автомобиля, КАСКО ему сейчас не актуально.
      Скажи "поняла вас, спасибо за ответ, всего доброго" и сразу заканчивай
      разговор, ничего больше не презентуй и не уточняй.

  - id: not_interested_categorical
    type: routing
    triggers:
      - "не интересно"
      - "не нужно"
      - "перестаньте звонить"
    response: >
      Клиент категорически отказался — дожимать и предлагать ещё раз нельзя.
      Скажи "поняла вас, спасибо за ответ, всего доброго" и сразу заканчивай
      разговор, без повторных попыток переубедить.