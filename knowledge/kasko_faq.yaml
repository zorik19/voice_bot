# База знаний: «КАСКО — вопросы по действующему полису/предложению» (голос).
# Адаптировано из текстовой базы поддержки: убраны ссылки, email, «нажмите кнопку»,
# номера пунктов правил — либо пересказаны словами, либо заменены на «направлю СМС».
# Пустые/несогласованные пункты исходной базы (17 шт.) сюда не включены.

scenario: kasko_faq
items:
  - id: competitor_discount
    type: faq
    triggers:
      - "другая страховая предложила дешевле"
      - "сможете дать скидку как у конкурентов"
      - "у вас не рыночная цена"
      - "не конкурентное предложение"
    response: >
      Пришлите нам предложение другой страховой — можно просто на почту, скриншот
      или проект полиса. Мы посмотрим условия и постараемся предложить максимально
      выгодный вариант.

  - id: callback_request
    type: faq
    triggers:
      - "можете мне перезвонить"
      - "хочу обсудить детали по телефону"
      - "пусть специалист позвонит"
    response: >
      Конечно, свяжем вас со специалистом по страхованию, он подробно обсудит все детали.

  - id: contract_review
    type: faq
    triggers:
      - "как ознакомиться с договором"
      - "можно посмотреть проект договора"
    response: >
      Могу коротко рассказать основные условия прямо сейчас простыми словами,
      либо направлю вам проект договора для ознакомления.

  - id: belarus_extension
    type: faq
    triggers:
      - "расширение на беларусь включено"
      - "полис действует в беларуси"
    response: >
      Уточню, включено ли у вас расширение на Белоруссию, и при необходимости
      подключим — это оформляется дополнительным соглашением к полису.

  - id: installments
    type: faq
    triggers:
      - "можно разделить оплату на части"
      - "есть ли рассрочка"
      - "оплатить в два платежа"
    response: >
      Да, можно в рассрочку: первый взнос при оформлении, второй — через три месяца.
      Оформить так?

  - id: official_dealer_repair
    type: faq
    triggers:
      - "можно ремонт у официального дилера"
      - "хочу чинить машину у дилера"
    response: >
      Да, можно перейти на ремонт у официального дилера с доплатой. Сделать для вас расчёт?

  - id: change_conditions
    type: faq
    triggers:
      - "хочу изменить условия полиса"
      - "нужно поменять условия страхования"
    response: >
      Конечно, поможем. Скажите, пожалуйста, какие именно условия нужно изменить.

  - id: how_to_pay
    type: faq
    triggers:
      - "как оплатить полис"
      - "куда платить"
    response: >
      Ссылку на оплату я вам направлю в СМС и на почту — оплатить можно картой любого банка.

  - id: add_driver_later
    type: faq
    triggers:
      - "можно вписать водителя позже"
      - "добавить водителя в течение года"
    response: >
      Да, добавить дополнительного водителя можно в любой момент действия полиса,
      это делается самостоятельно в личном кабинете.

  - id: partner_stations
    type: faq
    triggers:
      - "есть список станций техобслуживания"
      - "какие сто у вас в списке"
    response: >
      Список станций-партнёров предоставим при обращении по страховому случаю,
      он может обновляться в течение года, поэтому заранее не фиксируем.

  - id: how_to_renew
    type: faq
    triggers:
      - "как продлить каско"
      - "хочу продлить полис"
    response: >
      Направлю вам образец полиса и ссылку на оплату в СМС — проверьте, всё ли верно,
      и можно продлевать.

  - id: price_increased
    type: faq
    triggers:
      - "почему подорожал полис без аварий"
      - "цена выросла а страховых случаев не было"
    response: >
      Запчасти и ремонт заметно подорожали в целом по рынку, это и отражается
      на стоимости полиса у всех клиентов, даже без страховых случаев.

  - id: add_driver_docs
    type: faq
    triggers:
      - "что нужно чтобы добавить водителя"
      - "какие документы для нового водителя"
    response: >
      Пришлите, пожалуйста, водительское удостоверение нового водителя — с двух сторон,
      и мы его добавим.

  - id: inspection_needed
    type: faq
    triggers:
      - "нужен осмотр машины"
      - "надо приезжать на осмотр"
    response: >
      Осмотр не потребуется — для вас доступна акция «Переход»: оформление без осмотра,
      если уже есть действующий полис КАСКО.

  - id: sber_premier_discount
    type: faq
    triggers:
      - "применили скидку сбер премьер"
      - "учли скидку премьер"
    response: >
      Да, скидка Сбер Премьер подключается автоматически, отдельно оформлять не нужно.

  - id: who_covered
    type: faq
    triggers:
      - "каско действует только на меня"
      - "на кого распространяется полис"
    response: >
      КАСКО распространяется только на водителей, указанных в договоре.
      Если за руль сядет кто-то ещё — его лучше заранее вписать в полис.

  - id: payment_error
    type: faq
    triggers:
      - "при оплате выходит ошибка"
      - "не получается оплатить"
    response: >
      Спасибо, что сообщили. Сформируем новую ссылку на оплату и направим вам в СМС.

  - id: insurance_rules
    type: faq
    triggers:
      - "где посмотреть правила страхования"
      - "хочу изучить правила"
    response: >
      Направлю ссылку на правила страхования в СМС. Если по условиям возникнут
      вопросы — с радостью отвечу сама.

  - id: add_second_driver
    type: faq
    triggers:
      - "как вписать ещё одного водителя"
      - "хочу добавить второго водителя"
    response: >
      Если договор ещё оформляется — помогу добавить водителя сразу, нужны обе стороны
      водительского удостоверения. Если полис уже готов — можно сделать самостоятельно
      в личном кабинете.

  - id: where_sent
    type: faq
    triggers:
      - "куда вы направили документы"
      - "не вижу письма с полисом"
    response: >
      Образец полиса и ссылку на оплату я направлю вам в СМС. Проверьте, пожалуйста,
      папку спам на почте, если письма не будет.

  - id: profi_program
    type: faq
    triggers:
      - "что за программа профи"
      - "расскажите про профи"
    response: >
      Программа «Профи» для опытных водителей: полное покрытие КАСКО, а оплатить можно
      в два этапа — сначала половину, вторую половину — уже после страхового случая.
      Подготовить для вас расчёт?

  - id: glass_no_docs
    type: faq
    triggers:
      - "что входит в ремонт без справок"
      - "какие стёкла без справок"
    response: >
      Без справок можно отремонтировать один элемент кузова, а стёкла, фары
      и зеркало заднего вида — вообще без ограничений по числу обращений за год.

  - id: assistance_cities
    type: faq
    triggers:
      - "в каких городах работает эвакуатор"
      - "где доступен аварийный комиссар"
    response: >
      Список городов, где доступны аварийный комиссар и эвакуатор, направлю вам в СМС.

  - id: liability_scope
    type: faq
    triggers:
      - "го распространяется на всех водителей"
      - "ответственность действует на всех"
    response: >
      Гражданская ответственность защищает только водителей, вписанных в полис ОСАГО.
      Если за рулём окажется человек не из списка, по этому риску выплаты не будет.

  - id: data_changed
    type: faq
    triggers:
      - "у меня изменились данные"
      - "поменялись паспортные данные"
    response: >
      Спасибо, что сообщили. Подскажите, что именно изменилось — фамилия, адрес,
      телефон или паспорт — и пришлите подтверждающий документ, мы всё обновим.

  - id: drone_risk
    type: faq
    triggers:
      - "страховой случай при падении дрона"
      - "покрывает ли полис бпла"
    response: >
      Да, этот риск покрыт — падение беспилотника относится к падению инородных
      предметов и входит в ваше полное КАСКО.

  - id: policy_contents
    type: faq
    triggers:
      - "что входит в мой полис"
      - "расскажите условия полиса"
    response: >
      Сейчас соберу для вас условия полиса и направлю следующим сообщением в СМС.

  - id: risks_included
    type: faq
    triggers:
      - "какие риски входят в каско"
      - "входит ли угон в покрытие"
      - "что считается ущербом"
    response: >
      У вас полное покрытие: угон, полная гибель, ДТП, стихийные бедствия, пожар,
      взрыв, падение предметов, действия третьих лиц и животных, повреждение жидкостью
      и механические повреждения.

  - id: dealer_calc
    type: faq
    triggers:
      - "можно посчитать с официальным дилером"
      - "сделайте расчёт с дилером"
    response: >
      Да, расчёт с ремонтом у официального дилера возможен, подготовим и направим вам.

  - id: manager_contact
    type: faq
    triggers:
      - "дайте номер персонального менеджера"
      - "как связаться с менеджером по урегулированию"
    response: >
      Персональный менеджер по урегулированию подключится сразу после регистрации
      страхового случая, ждать заранее не нужно.

  - id: off_road_coverage
    type: faq
    triggers:
      - "покрывает ли полис вне дорог"
      - "действует ли каско во дворе"
    response: >
      Да, дворы, стоянки, заправки и территории рядом с дорогами тоже входят
      в зону покрытия КАСКО.

  - id: franchise_glass
    type: faq
    triggers:
      - "франшиза действует на стёкла"
      - "при ремонте стекла есть франшиза"
    response: >
      Франшиза применяется по стеклянному элементу только если виновник ДТП
      не установлен.

  - id: total_loss_percent
    type: faq
    triggers:
      - "с какого процента считается полная гибель"
      - "какой порог тотала"
    response: >
      Полной гибелью у нас считается повреждение от семидесяти процентов стоимости.
      Это осознанный порог — чем он ниже, тем выше риск, что машину спишут, а не
      отремонтируют новыми деталями.

  - id: expand_liability
    type: faq
    triggers:
      - "можно расширить ответственность"
      - "увеличить сумму по го"
    response: >
      Да, риск можно расширить — есть несколько вариантов суммы, с доплатой.
      Какую сумму рассмотреть для вас?

  - id: theft_payout_timing
    type: faq
    triggers:
      - "когда выплата при угоне"
      - "возмещение после угона когда"
    response: >
      Возмещение по угону начинается после того, как вы предоставите документы
      об открытии уголовного дела — ждать его завершения не нужно.

  - id: mileage_limit
    type: faq
    triggers:
      - "можно ограничение пробега для скидки"
      - "снизить цену за пробег"
    response: >
      У нас нет ограничения по пробегу — полис покрывает все случаи вне зависимости
      от того, сколько проехал автомобиль. Но можем посмотреть другие варианты снижения
      стоимости.

  - id: price_4x_increase
    type: faq
    triggers:
      - "почему цена в несколько раз больше"
      - "стоимость сильно выросла"
    response: >
      Да, цена выросла — обычно это связано с прошлыми страховыми случаями
      и подорожанием запчастей. Мы постарались дать максимально возможную скидку
      при продлении.

  - id: verify_identity
    type: faq
    triggers:
      - "как убедиться что это сберстрахование"
      - "не мошенники ли вы"
    response: >
      Для вашего спокойствия направим СМС с официального номера СберСтрахования,
      чтобы вы могли убедиться.

  - id: osago_calc
    type: faq
    triggers:
      - "можете посчитать осаго"
      - "нужен расчёт осаго"
    response: >
      Оформить ОСАГО можно в приложении СберБанк Онлайн, в разделе страхования.

  - id: where_30_discount
    type: faq
    triggers:

      - "где обещанная скидка тридцать процентов"
      - "почему скидка меньше тридцати"
    response: >
      Мы всегда стараемся дать максимально возможную скидку, но итоговый размер
      зависит от нескольких факторов и не всегда доходит до тридцати процентов.
      Предложение с текущим расчётом действует четырнадцать дней.

  - id: model_name_mismatch
    type: faq
    triggers:
      - "в документах модель написана по-другому"
      - "не совпадает название модели авто"
    response: >
      Не переживайте, проблем это не создаст — марка и модель у нас определяются
      по вин-номеру, регистр букв значения не имеет.