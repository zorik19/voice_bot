[project]
name = "voicebot"
version = "0.1.0"
description = "Голосовой AI-продавец ОСАГО (MVP)"
requires-python = ">=3.11"
dependencies = [
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "numpy>=1.26",
    "sounddevice>=0.4.6",
    "gigachat>=0.1.35",
    "anthropic>=0.40",
    "faster-whisper>=1.0",
    "silero-vad>=5.1",
    "torch>=2.2",
    "omegaconf>=2.3",
]

[project.optional-dependencies]
elevenlabs = ["elevenlabs>=1.0"]
